# =====================================================================
# LinkedIn Auto-Post — GitHub Actions workflow (runs in the cloud)
#
# Triggers every 2 days and:
#   1. Creates a fresh .env from GitHub Secrets (never stored in repo)
#   2. Installs dependencies
#   3. Runs linkedin_pipeline.py (generate content + image + publish)
#   4. Commits post-history back so uniqueness checks still work
#
# Uses GitHub Secrets so the real API keys live encrypted in Settings.
# =====================================================================
name: LinkedIn Auto-Post (Every 2 Days)

on:
  schedule:
    # Run every 2 days at 09:00 UTC. GitHub cron can't express
    # "every N days" natively, so this uses day-of-month step 2:
    # days 1, 3, 5, 7, ... of each month (still a 2-day cadence).
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit post-history back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    # Guard against overlapping runs (e.g. manual + scheduled fired together)
    concurrency:
      group: linkedin-auto-post
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Fetch encrypted secrets into a local .env (which is git-ignored).
      # These come from Settings > Secrets and variables > Actions.
      - name: Create .env from GitHub Secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "LINKEDIN_TOKEN=${{ secrets.LINKEDIN_TOKEN }}" >> .env
          echo "STABILITY_AI=${{ secrets.STABILITY_AI }}" >> .env
          echo "  (secrets applied — .env is git-ignored, will not be pushed)"

      - name: Run the LinkedIn posting pipeline
        run: |
          python linkedin_pipeline.py
        # If it throws, the workflow fails and GitHub emails you.
        # The pipeline already retries 429/5xx internally, so transient
        # rate-limit hiccups usually succeed on their own.

      # Persist new post history back to the repo. We commit the plain-text
      # posts_history.json (git-friendly) — the binary ChromaDB folder is
      # regenerated from it on the next run via _seed_from_history().
      - name: Commit post history (uniqueness persistence)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_history.json
          if ! git diff --cached --quiet posts_history.json; then
            git commit -m "chore: persist post history from scheduled run"
            git push
            echo "Committed post history."
          else
            echo "No post-history changes to commit."
          fi