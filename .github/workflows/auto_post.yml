# =====================================================================
# LinkedIn Auto-Post — GitHub Actions workflow (runs in the cloud)
#
# Triggers every 4 days and:
#   1. Creates a fresh .env from GitHub Secrets (never stored in repo)
#   2. Installs dependencies
#   3. Runs linkedin_pipeline.py (generate content + image + publish)
#   4. Commits post-history back so uniqueness checks still work
#
# Uses GitHub Secrets so the real API keys live encrypted in Settings.
# =====================================================================
name: LinkedIn Auto-Post (Every 4 Days)

on:
  schedule:
    # Runs daily at 09:00 UTC; the check step below enforces the real 4-day gap.
    - cron: "0 9 * * *"
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit post-history back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    # Guard against overlapping runs (e.g. manual + scheduled fired together)
    concurrency:
      group: linkedin-auto-post
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # NOTE: cron's */4 day-of-month resets each month, breaking a true 4-day cadence — this daily cron + day-of-year%4 check fixes it, without failing the job on off-days.
      - name: Check if scheduled day
        id: check
        if: github.event_name == 'schedule'
        run: |
          day_of_year=$(date +%j)
          # "10#" forces base-10 parsing (avoids octal issues with date's leading zeros).
          if [ $(( 10#$day_of_year % 4 )) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled day matched (day $day_of_year) — proceeding."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled day (day $day_of_year) — remaining steps will be skipped."
          fi

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Fetches encrypted secrets (Settings > Secrets and variables > Actions) into a git-ignored local .env.
      - name: Create .env from GitHub Secrets
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_run == 'true'
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "LINKEDIN_TOKEN=${{ secrets.LINKEDIN_TOKEN }}" >> .env
          echo "STABILITY_AI=${{ secrets.STABILITY_AI }}" >> .env
          echo "  (secrets applied — .env is git-ignored, will not be pushed)"

      - name: Run the LinkedIn posting pipeline
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_run == 'true'
        run: |
          python linkedin_pipeline.py

      # Persists plain-text posts_history.json to repo; ChromaDB folder is regenerated from it via _seed_from_history() next run.
      - name: Commit post history (uniqueness persistence)
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts_history.json
          if ! git diff --cached --quiet posts_history.json; then
            git commit -m "chore: persist post history from scheduled run"
            git push
            echo "Committed post history."
          else
            echo "No post-history changes to commit."
          fi